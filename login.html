<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Tvxbox</title>
  <link rel="stylesheet" href="auth.css">
  <link rel="manifest" href="pwa/manifest.json">
  <meta name="theme-color" content="#141414">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="/pwa/icon-192.png">
  <style>
    /* ── Slideshow de fundo ── */
    .auth-bg-slideshow {
      position: fixed; inset: 0; z-index: 0; overflow: hidden;
    }
    .auth-bg-slideshow .slide {
      position: absolute; inset: 0;
      background-size: cover; background-position: center;
      opacity: 0; transition: opacity 1.2s ease;
    }
    .auth-bg-slideshow .slide.ativo { opacity: 1; }

    /* Cards flutuantes */
    .preview-cards {
      position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden;
    }
    .preview-float-card {
      position: absolute; width: 130px; border-radius: 10px; overflow: hidden;
      box-shadow: 0 8px 28px rgba(0,0,0,.7);
      opacity: 0; transform: translateY(20px) scale(0.92);
      animation: floatIn 0.7s ease forwards;
    }
    .preview-float-card img { width: 100%; display: block; aspect-ratio: 2/3; object-fit: cover; }
    @keyframes floatIn { to { opacity: 0.85; transform: translateY(0) scale(1); } }

    /* Gradiente lateral */
    .preview-left-fade {
      position: fixed; inset: 0; z-index: 2;
      background: linear-gradient(
        to right,
        rgba(10,10,10,0.15) 0%,
        rgba(10,10,10,0.55) 55%,
        rgba(10,10,10,0.97) 78%,
        rgba(10,10,10,1)    100%
      );
    }

    .auth-page { background: transparent; }
    .auth-overlay { display: none; }
    .auth-container { position: relative; z-index: 10; }
    .auth-container.single-column { justify-content: center; }

    /* ── Banner sem assinatura ── */
    .banner-sem-assinatura {
      background: #1a0000;
      border: 1.5px solid #e50914;
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 16px;
      font-size: 13px;
      color: #ffaaaa;
      line-height: 1.5;
      display: none;
    }
    .banner-sem-assinatura a { color: #e50914; font-weight: 700; }

    @media (max-width: 768px) {
      .auth-right { max-width: 100%; }
    }
  </style>
</head>
<body>

  <!-- Fundo animado -->
  <div class="auth-bg-slideshow" id="bgSlideshow"></div>
  <div class="preview-cards" id="previewCards"></div>
  <div class="preview-left-fade"></div>

  <div class="auth-page">
    <div class="auth-overlay"></div>
    <div class="auth-container single-column">

      <!-- Formulário de login -->
      <div class="auth-right full-width">
        <div class="auth-box">
          <h2>Entrar</h2>

          <!-- Banner aparece quando redirecionado por falta de assinatura -->
          <div class="banner-sem-assinatura" id="bannerSemAssinatura">
            🔒 <strong>Acesso restrito.</strong>
            Faça login para ver os detalhes da assinatura e pagar via Pix.
          </div>

          <form id="loginForm">
            <div class="input-group">
              <label for="loginEmail">E-mail</label>
              <input type="email" id="loginEmail" placeholder="Digite seu e-mail" required>
            </div>
            <div class="input-group">
              <label for="loginSenha">Senha</label>
              <input type="password" id="loginSenha" placeholder="Digite sua senha" required>
            </div>
            <button type="submit" class="main-btn">Entrar</button>
          </form>

          <p id="loginMensagem" class="mensagem"></p>

          <div class="auth-links">
            <span>Ainda não tem conta?</span>
            <a href="cadastro.html">Criar conta</a>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="auth.js"></script>
  <script src="pwa/register-sw.js"></script>

  <script>
    // Banner sem assinatura
    (function() {
      if (new URLSearchParams(window.location.search).get("sem_assinatura") === "1") {
        document.getElementById("bannerSemAssinatura").style.display = "block";
      }
    })();

    // Slideshow de fundo + cards flutuantes (só decorativo)
    (async function initPreview() {
      const API = "https://smartbox-backend.onrender.com";
      let itens = [];
      try {
        const token = (() => { try { return JSON.parse(localStorage.getItem("sb_token")); } catch { return ""; } })();
        const r = await fetch(API + "/catalogo", {
          headers: { "Authorization": "Bearer " + token }
        });
        if (r.ok) {
          const data = await r.json();
          itens = [
            ...(data.destaques || []),
            ...(data.animes    || []),
            ...(data.series    || []),
            ...(data.mangas    || []),
          ].filter(i => i.poster);
        }
      } catch {}
      if (!itens.length) return;

      // Slideshow
      const bgEl = document.getElementById("bgSlideshow");
      itens.forEach((item, i) => {
        const s = document.createElement("div");
        s.className = "slide" + (i === 0 ? " ativo" : "");
        s.style.backgroundImage = `url('${item.poster}')`;
        bgEl.appendChild(s);
      });
      let cur = 0;
      const slides = bgEl.querySelectorAll(".slide");
      setInterval(() => {
        slides[cur].classList.remove("ativo");
        cur = (cur + 1) % slides.length;
        slides[cur].classList.add("ativo");
      }, 4000);

      // Cards flutuantes
      const cardsEl = document.getElementById("previewCards");
      const posicoes = [
        { left:"2%",  top:"8%"  }, { left:"16%", top:"5%"  }, { left:"30%", top:"10%" },
        { left:"7%",  top:"45%" }, { left:"22%", top:"42%" }, { left:"35%", top:"48%" },
        { left:"4%",  top:"72%" }, { left:"18%", top:"70%" }, { left:"32%", top:"75%" },
      ];
      [...itens].sort(() => Math.random() - 0.5).slice(0, posicoes.length).forEach((item, i) => {
        const card = document.createElement("div");
        card.className = "preview-float-card";
        card.style.left = posicoes[i].left;
        card.style.top  = posicoes[i].top;
        card.style.animationDelay = `${i * 0.18}s`;
        card.innerHTML = `<img src="${item.poster}" alt="${item.titulo}" loading="lazy">`;
        cardsEl.appendChild(card);
      });
      setInterval(() => {
        const cards = cardsEl.querySelectorAll(".preview-float-card");
        const card  = cards[Math.floor(Math.random() * cards.length)];
        const novo  = itens[Math.floor(Math.random() * itens.length)];
        card.style.cssText += "opacity:0;transform:translateY(20px) scale(0.92);transition:opacity .5s,transform .5s;";
        setTimeout(() => {
          card.querySelector("img").src = novo.poster;
          card.style.opacity = "0.85";
          card.style.transform = "translateY(0) scale(1)";
        }, 500);
      }, 6000);
    })();
  </script>
</body>
</html>
