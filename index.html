<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tvxbox</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="pwa/manifest.json">
  <meta name="theme-color" content="#141414">
  <link rel="apple-touch-icon" href="/pwa/icon-192.png">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <style>
    .generos-box { margin-bottom: 28px; }
    .generos-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .genero-pill {
      padding: 8px 18px;
      border-radius: 999px;
      border: 1.5px solid #333;
      background: #1e1e1e;
      color: #ddd;
      font-size: 14px;
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
      text-decoration: none;
      display: inline-block;
    }
    .genero-pill:hover { background: #e50914; border-color: #e50914; color: #fff; }
    .genero-pill.hidden { display: none !important; }
    .genero-mais {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1.5px solid #444;
      background: #1e1e1e;
      color: #888;
      font-size: 18px;
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
      line-height: 1;
      letter-spacing: 1px;
    }
    .genero-mais:hover { background: #2a2a2a; border-color: #666; color: #fff; }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="index.html" class="logo">TVXBOX</a>

    <button class="menu-toggle" id="menuToggle" aria-label="Menu" aria-expanded="false">☰</button>

    <nav class="main-nav" id="mainNav">
      <a href="index.html">Início</a>
      <a href="ao-vivo.html">Ao Vivo</a>
      <a href="mangas.html">Mangás</a>
      <a href="jogos.html">Jogos</a>
    </nav>

    <div class="header-right">
      <button class="search-icon-btn" id="searchIconBtn" aria-label="Buscar">🔍</button>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Buscar..." readonly style="cursor:pointer">
      </div>
      <div class="user-box">
        <span id="usuarioNome"></span>
        <button id="btnSair" type="button">Sair</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="toolbar">
      <div class="filtros">
        <button class="filter-btn active" data-filter="todos">Todos</button>
        <button class="filter-btn" data-filter="Filme">Filmes</button>
        <button class="filter-btn" data-filter="Anime">Animes</button>
        <button class="filter-btn" data-filter="Série">Séries</button>
      </div>
    </section>

    <section id="generosBox" class="generos-box hidden">
      <div class="section-header"><h2>Explorar por gênero</h2></div>
      <div id="generosRow" class="generos-row"></div>
    </section>

    <section id="continuarBox" class="continuar-box hidden">
      <div class="section-header"><h2>Continuar assistindo</h2></div>
      <div id="continuarCard"></div>
    </section>

    <section id="favoritosBox" class="favoritos-box hidden">
      <div class="section-header"><h2>Minha lista</h2></div>
      <div id="favoritosRow" class="poster-row"></div>
    </section>

    <section>
      <div class="section-header"><h2>Em destaque</h2></div>
      <div id="rowDestaques" class="poster-row"></div>
    </section>

    <section>
      <div class="section-header"><h2>Animes</h2></div>
      <div id="rowAnimes" class="poster-row"></div>
    </section>

    <section>
      <div class="section-header"><h2>Séries</h2></div>
      <div id="rowSeries" class="poster-row"></div>
    </section>


  </main>

  <script src="script.js"></script>
  <script src="pwa/register-sw.js"></script>
  <script>
  (function() {
    function coletarGeneros() {
      if (typeof catalogoData === "undefined" || !catalogoData) return [];
      const todos = [
        ...(catalogoData.destaques || []),
        ...(catalogoData.animes    || []),
        ...(catalogoData.series    || []),
      ];
      const set = new Set();
      todos.forEach(item => (item.generos || []).forEach(g => set.add(g)));
      return [...set].sort((a, b) => a.localeCompare(b, "pt-BR"));
    }

    const LIMITE = 6;

    function montarGeneros() {
      const generos = coletarGeneros();
      if (!generos.length) return;
      const box = document.getElementById("generosBox");
      const row = document.getElementById("generosRow");
      row.innerHTML = "";
      let expandido = false;

      generos.forEach((g, i) => {
        const a = document.createElement("a");
        a.className = "genero-pill";
        a.textContent = g;
        a.href = `busca.html?genero=${encodeURIComponent(g)}`;
        if (i >= LIMITE) a.classList.add("hidden");
        row.appendChild(a);
      });

      if (generos.length > LIMITE) {
        const btn = document.createElement("button");
        btn.className = "genero-mais";
        btn.textContent = "···";
        btn.title = "Ver todos os gêneros";
        btn.addEventListener("click", () => {
          expandido = !expandido;
          row.querySelectorAll(".genero-pill.hidden, .genero-pill").forEach((el, i) => {
            if (i >= LIMITE) el.classList.toggle("hidden", !expandido);
          });
          btn.textContent = expandido ? "−" : "···";
        });
        row.appendChild(btn);
      }

      box.classList.remove("hidden");
    }

    function aguardarCatalogo(cb, tentativas = 20) {
      if (typeof catalogoData !== "undefined" && catalogoData) { cb(); return; }
      if (tentativas <= 0) return;
      setTimeout(() => aguardarCatalogo(cb, tentativas - 1), 150);
    }

    aguardarCatalogo(montarGeneros);
  })();
  </script>
</body>
</html>
